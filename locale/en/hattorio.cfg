[mod-setting-description]
hattorio-band-style=What the bands between cells are made of. Dark liquid moves and oozes; void is a flat, still hole.
hattorio-band-colour=What colour the bands are tinted. Every option is near-black; they differ in the highlight the surface catches at its edges. Reflected cells, about one in eight, are tinted more strongly so you can pick them out.
hattorio-richness-override=Multiplier applied to ore in newly generated chunks, replacing the automatic compensation for ore the bands put out of reach. Leave at 0 to compensate automatically from your cell size and band width.
hattorio-show-outline=Draw a line along the centre of each band. Affects only your own view.
hattorio-hat-size-nauvis=How large each buildable cell is. Smaller cells are harder: less room, and only smaller blueprints stay reusable. 15 gives about 116 tiles per cell, 41 about 944, 52 about 1,584.
hattorio-band-width-nauvis=How wide the unbuildable band between cells is. Wider bands take more of the map and make crossings more awkward. All widths can be spanned by underground belts.
hattorio-hat-size-vulcanus=How large each buildable cell is. Smaller cells are harder.
hattorio-band-width-vulcanus=How wide the unbuildable band between cells is.
hattorio-hat-size-fulgora=How large each buildable cell is. Smaller cells are harder.
hattorio-band-width-fulgora=How wide the unbuildable band between cells is.
hattorio-hat-size-gleba=How large each buildable cell is. Smaller cells are harder.
hattorio-band-width-gleba=How wide the unbuildable band between cells is.
hattorio-hat-size-aquilo=How large each buildable cell is. Smaller cells are harder.
hattorio-band-width-aquilo=How wide the unbuildable band between cells is.

