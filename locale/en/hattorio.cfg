[mod-setting-description]
hattorio-band-style=The material of the bands between cells. Dark liquid moves and oozes. Void is a flat, still hole.
hattorio-band-colour=The tint of the bands. Every option is near-black. The highlight at the edges of the surface tells the options apart. Reflected cells, about one in eight, get a stronger tint, so you can pick them out.
hattorio-richness-override=A multiplier for the ore in newly generated chunks. It replaces the automatic compensation for the ore that the bands put out of reach. Leave it at 0 to compensate automatically from your cell size and band width.
hattorio-show-outline=Draw a line along the centre of each band. Affects only your own view.
hattorio-hat-size-nauvis=How large each buildable cell is. Smaller cells are harder: less room, and only smaller blueprints stay reusable. At the default band width, 15 gives about 63 buildable tiles per cell, 26 about 294, 41 about 858, and 52 about 1,473.
hattorio-band-width-nauvis=How wide the unbuildable band between cells is. Wider bands take more of the map and make crossings more awkward. Underground belts can cross every width.
hattorio-hat-size-vulcanus=How large each buildable cell is. Smaller cells are harder.
hattorio-band-width-vulcanus=How wide the unbuildable band between cells is.
hattorio-hat-size-fulgora=How large each buildable cell is. Smaller cells are harder.
hattorio-band-width-fulgora=How wide the unbuildable band between cells is.
hattorio-hat-size-gleba=How large each buildable cell is. Smaller cells are harder.
hattorio-band-width-gleba=How wide the unbuildable band between cells is.
hattorio-hat-size-aquilo=How large each buildable cell is. Smaller cells are harder.
hattorio-band-width-aquilo=How wide the unbuildable band between cells is.

[command-help]
hattorio-info=Report the cell size, band width and ore richness in force on this surface.

