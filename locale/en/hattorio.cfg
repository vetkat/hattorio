[string-mod-setting]
hattorio-band-style-liquid=Dark liquid (animated)
hattorio-band-style-void=Void (flat black)
hattorio-band-style-rift=Glowing rift (needs Space Age)

[mod-setting-description]
hattorio-band-style=What the bands between cells are made of. Dark liquid moves and oozes. Void is a flat, still hole. Glowing rift uses the lava shader and needs Space Age, falling back to dark liquid without it.
hattorio-richness-override=Multiplier applied to ore in newly generated chunks, replacing the automatic compensation for ore the bands put out of reach. Leave at 0 to compensate automatically from your cell size and band width.
hattorio-show-outline=Draw a line along the centre of each band. Affects only your own view.
hattorio-hat-size-nauvis=Distance from a cell's centre to its furthest corner, in tiles. Larger cells give more room and let larger blueprints be reused.
hattorio-band-width-nauvis=Width of the unbuildable band between cells, in tiles. Keep below underground belt reach or cells become isolated.
hattorio-hat-size-vulcanus=Distance from a cell's centre to its furthest corner, in tiles.
hattorio-band-width-vulcanus=Width of the unbuildable band between cells, in tiles.
hattorio-hat-size-fulgora=Distance from a cell's centre to its furthest corner, in tiles.
hattorio-band-width-fulgora=Width of the unbuildable band between cells, in tiles.
hattorio-hat-size-gleba=Distance from a cell's centre to its furthest corner, in tiles.
hattorio-band-width-gleba=Width of the unbuildable band between cells, in tiles.
hattorio-hat-size-aquilo=Distance from a cell's centre to its furthest corner, in tiles.
hattorio-band-width-aquilo=Width of the unbuildable band between cells, in tiles.

