name: watch

# Factorio 2.1 refused to load Hattorio 1.0.0, and the players saw it first.
# This workflow looks for a new Factorio release every three hours. A stable
# or experimental release can differ from the pin. Then the workflow runs the
# in-game tests in that release, with and without Space Age.
#
# A failed scheduled run makes GitHub notify the maintainer. A cache entry
# marks each test as done for one commit on main. So each result notifies
# once, and a run with nothing new starts no test runner.
# factorio-version.yml moves the pin to a new stable release.
#
# GitHub turns off the schedules of a public repository after 60 days with
# no commit. On each run, the keepalive job enables the scheduled workflows
# again, and that resets the count.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in watch.yml weekly.yml factorio-version.yml; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
          done

  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: List the markers of earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh cache list --repo "$GITHUB_REPOSITORY" --key watch- --limit 1000
          --json key --jq '.[].key' > "$RUNNER_TEMP/keys"
      - id: plan
        run: python3 -m tools.factorio_version plan "$GITHUB_SHA" "$RUNNER_TEMP/keys" >> "$GITHUB_OUTPUT"

  ingame:
    name: in-game on ${{ matrix.version }} (${{ matrix.mode }})
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A new minor version needs another factorio_version in info.json, or
      # the game does not load the mod. This changes only this checkout.
      - run: python3 -m tools.factorio_version retarget ${{ matrix.version }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/factorio-cache
          key: factorio-headless-${{ matrix.version }}
      - run: make ingame MODE=${{ matrix.mode }}
        env:
          FACTORIO_VERSION: ${{ matrix.version }}
          FACTORIO_CACHE: ${{ runner.temp }}/factorio-cache
      # Pass or fail, mark the test of this release at this commit as done.
      - if: always()
        run: touch .watch-done
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: .watch-done
          key: watch-${{ matrix.version }}-${{ matrix.mode }}-${{ github.sha }}
