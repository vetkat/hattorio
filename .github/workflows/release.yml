name: release

# To make a release, push a tag v<version> on main. info.json is the only
# source of truth for the version. The tag and the changelog must agree with
# it, or nothing is built. So the mod portal can never describe a build that
# nobody has.
#
# A tag starts these steps:
#
#   1. every check in check.yml
#   2. the zip, and the GitHub release
#   3. the upload of the zip to the mod portal
#   4. the long description, sent to the portal
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: dry-run
        options:
          - dry-run             # check and build only; never uses the portal
          - check-credentials   # validate the API key, publish nothing
          - publish             # check, build and upload to the portal
          - description         # send mod-description-long.md to the portal

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'push' || inputs.mode == 'dry-run' || inputs.mode == 'publish'
    uses: ./.github/workflows/check.yml

  build:
    name: verify and build
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail unless the tagged commit is on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check the version
        run: python3 -m tools.check_version ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: python3 -m tools.package
      - name: Write the release notes from CHANGELOG.md
        run: python3 -m tools.changelog notes > build/notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: mod-zip
          path: |
            build/*.zip
            build/notes.md
          if-no-files-found: error

  github-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mod-zip
          path: build
      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" build/*.zip
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --notes-file build/notes.md

  publish:
    name: mod portal upload
    needs: build
    # Only on a tag, or on a manual run that asks for it explicitly. You
    # cannot withdraw a portal release, so this must never run by accident.
    if: github.event_name == 'push' || inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    # Give this environment a required reviewer if you want a person to
    # approve before anything reaches the portal.
    environment: mod-portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mod-zip
          path: build
      - name: upload
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: sh tools/publish_mod.sh build/*.zip

  credentials:
    name: mod portal credentials
    if: inputs.mode == 'check-credentials'
    runs-on: ubuntu-24.04
    environment: mod-portal
    steps:
      - uses: actions/checkout@v7
      - env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: sh tools/publish_mod.sh --check

  # After an upload, or alone in the mode "description". description.yml
  # also runs on its own when mod-description-long.md changes on main.
  description:
    needs: publish
    if: >-
      always() &&
      (needs.publish.result == 'success' || inputs.mode == 'description')
    uses: ./.github/workflows/description.yml
    secrets: inherit
